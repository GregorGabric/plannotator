name: guide.show deploy

# Publishes the portable Guided Review viewer to guide.show. Runs on Plannotator
# release tags (decision record D10) so a viewer build == a Plannotator version,
# and on manual dispatch. Viewer files are add-only in R2 (D8): the deploy
# script refuses to overwrite an entry with different bytes and never deletes.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

concurrency:
  group: guide-show-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format compatibility (every shipped fixture parses) + worker tests
        run: bun test ./packages/core/guide-format.test.ts ./apps/guide-show/worker/index.test.ts

      - name: Build viewer
        run: bun run --cwd apps/guide-show build:viewer

      - name: Size budgets
        run: bun run --cwd apps/guide-show check:budgets

      - name: Checked-in manifest matches this build
        run: bun run --cwd apps/guide-show check:manifest

      - name: Publish viewer files to R2 (add-only)
        run: bun run --cwd apps/guide-show deploy:viewer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy worker + landing
        working-directory: apps/guide-show
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke the published viewer entry
        run: |
          JS=$(node -e "console.log(require('./apps/guide-show/viewer-manifest.json').js)")
          curl -fsSI "https://guide.show/v1/$JS" | tee /tmp/headers.txt
          grep -qi 'cache-control: public, max-age=31536000, immutable' /tmp/headers.txt
          grep -qi 'access-control-allow-origin: \*' /tmp/headers.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: guide-show-viewer-manifest
          path: apps/guide-show/dist/viewer/manifest.json
