name = "guides-show"
main = "worker/index.ts"
compatibility_date = "2025-06-01"

# Custom domain (top-level: must precede any [table] in TOML).
routes = [
  { pattern = "guides.show", custom_domain = true }
]

# Immutable viewer files (v1/…) live in R2 — never deleted or overwritten
# (decision record D8). Uploaded add-only by build/deploy-viewer.ts.
[[r2_buckets]]
binding = "VIEWER"
bucket_name = "guides-show-viewer"

# Shared guides (/g/<id>, /api/g*): one body object `g/<id>` plus one metadata
# object `g/<id>.meta` per guide (share/stores/r2.ts). Deletable, unlike /v1.
# The bucket must exist before the first deploy: `wrangler r2 bucket create guides-show-guides`.
[[r2_buckets]]
binding = "GUIDES"
bucket_name = "guides-show-guides"

# Optional: per-IP rate limit on guide uploads (POST /api/g); reads and pages
# are never limited. The handler is a no-op when the binding is absent, so
# removing this block only removes the limit. `namespace_id` is any integer
# unique within the account; `period` must be 10 or 60 (seconds).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Optional: keep no shared guide longer than this many seconds. Uploads without
# a ttl get this lifetime and longer requests are clamped; leave it out to keep
# guides until whoever shared them removes them (the contract default). This is
# the operator's brake on storage growth from anonymous uploads.
# [vars]
# MAX_TTL_SECONDS = "7776000"   # 90 days

# Landing page only. Assets are a per-deploy snapshot, which is why the viewer
# is NOT served from here.
[assets]
directory = "./site"
binding = "ASSETS"
run_worker_first = ["/v1/*", "/g/*", "/api/*", "/healthz"]
