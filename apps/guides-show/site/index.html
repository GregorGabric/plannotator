<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>guides.show</title>
<meta name="description" content="Portable Guided Reviews from Plannotator — one small HTML file, the full diff walkthrough.">
<style>
  :root{color-scheme:light dark;--bg:#f5f7f6;--ink:#1c2421;--muted:#5b6a64;--accent:#2b7f6c}
  @media (prefers-color-scheme:dark){:root{--bg:#121815;--ink:#dbe4df;--muted:#93a39c;--accent:#63c8b0}}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:60ch;margin:14vh auto 0;padding:0 1.25rem}
  h1{font-size:2rem;letter-spacing:-.01em;margin:0 0 .5rem}
  p{margin:.5rem 0;color:var(--muted)}
  a{color:var(--accent)}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em}
</style>
</head>
<body>
<main>
  <h1>guides.show</h1>
  <p>Hosts the viewer behind portable <a href="https://plannotator.ai/docs/commands/code-review#guided-review">Plannotator Guided Reviews</a>: a guide you were sent is one small HTML file that loads its renderer from here.</p>
  <p>Viewer builds live under <code>/v1/</code> and never change once published, so a guide exported today keeps opening.</p>
</main>
</body>
</html>
